name: Tauri Release (macOS, Windows)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps (npm ci)
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: npm ci

      - name: Install deps (npm install)
        if: ${{ hashFiles('package-lock.json') == '' }}
        run: npm install

      - name: Build web app
        run: npm run build

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Tauri build and release
        uses: tauri-apps/tauri-action@v0
        with:
          tauriScript: npx tauri
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: "Automated Tauri release"
          includeDebug: false
          prerelease: false
          macOSUniversal: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          # Uncomment only if your key is password-protected:
          # TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          # TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      # WINDOWS: prefer tauri's latest.json -> latest-windows.json; fallback to building from assets
      - name: Prepare + upload latest-windows.json
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          try {
            gh release download "${{ github.ref_name }}" -p latest.json -D .
            Rename-Item latest.json latest-windows.json
            gh release upload "${{ github.ref_name }}" latest-windows.json --clobber
          } catch {
            Write-Host "No latest.json; generating from assets..."
            gh release download "${{ github.ref_name }}" -p "*_x64_en-US_windows.msi" -D .
            gh release download "${{ github.ref_name }}" -p "*_x64_en-US_windows.msi.sig" -D . -R
            $msi = Get-ChildItem *.msi | Select-Object -First 1
            if (-not $msi) { throw "MSI not found in release assets" }
            $sig = "$($msi.Name).sig"
            if (-not (Test-Path $sig)) { throw "Signature not found for $($msi.Name)" }
            $sigContent = Get-Content $sig -Raw
            $version = "${{ github.ref_name }}".Substring(1)
            $url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${($msi.Name)}"
            $json = @{
              version = $version
              notes = "Automated Tauri release"
              pub_date = (Get-Date).ToUniversalTime().ToString("s") + "Z"
              platforms = @{
                "windows-x86_64" = @{ signature = $sigContent; url = $url }
                "windows-x86_64-msi" = @{ signature = $sigContent; url = $url }
              }
            } | ConvertTo-Json -Depth 6
            $json | Out-File latest-windows.json -Encoding utf8
            gh release upload "${{ github.ref_name }}" latest-windows.json --clobber
          }

      # macOS: download DMG + .sig from the release, then generate latest-macos.json
      - name: Generate + upload latest-macos.json
        if: matrix.os == 'macos-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release download "${TAG}" -p "*.dmg" -D .
          gh release download "${TAG}" -p "*.dmg.sig" -D . || true
          DMG="$(ls *.dmg | head -n1 || true)"
          if [ -z "${DMG}" ]; then echo "No DMG asset on release"; exit 1; fi
          SIG_FILE="${DMG}.sig"
          if [ ! -f "${SIG_FILE}" ]; then
            SIG_FILE="$(ls *.dmg.sig | head -n1 || true)"
          fi
          if [ -z "${SIG_FILE}" ] || [ ! -f "${SIG_FILE}" ]; then
            echo "Signature file not found for ${DMG}"; exit 1
          fi
          VERSION="${TAG#v}"
          PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          URL="https://github.com/${REPO}/releases/download/${TAG}/${DMG}"
          SIG_CONTENT="$(cat "${SIG_FILE}")"
          cat > latest-macos.json <<JSON
          {
            "version": "${VERSION}",
            "notes": "Automated Tauri release",
            "pub_date": "${PUB_DATE}",
            "platforms": {
              "darwin-x86_64": { "signature": ${SIG_CONTENT@Q}, "url": "${URL}" },
              "darwin-aarch64": { "signature": ${SIG_CONTENT@Q}, "url": "${URL}" }
            }
          }
          JSON
          gh release upload "${TAG}" latest-macos.json --clobber