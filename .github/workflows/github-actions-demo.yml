name: Tauri Release (macOS, Windows)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps (npm ci)
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: npm ci

      - name: Install deps (npm install)
        if: ${{ hashFiles('package-lock.json') == '' }}
        run: npm install

      - name: Build web app
        run: npm run build

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Tauri build and release
        uses: tauri-apps/tauri-action@v0
        with:
          tauriScript: npx tauri
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: "Automated Tauri release"
          includeDebug: false
          prerelease: false
          macOSUniversal: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          # Only include the PASSWORD envs if your key is encrypted:
          # TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          # TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      # Rename and upload platform-specific latest.json
      - name: Prepare latest.json (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          LATEST=$(find src-tauri/target/release/bundle -name latest.json | head -n1)
          echo "Found: $LATEST"
          cp "$LATEST" latest-macos.json

      - name: Prepare latest.json (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $latest = Get-ChildItem -Path src-tauri\target\release\bundle -Filter latest.json -Recurse | Select-Object -First 1
          Write-Host "Found: $($latest.FullName)"
          Copy-Item $latest.FullName latest-windows.json

      - name: Upload platform latest.json to release
        if: ${{ (matrix.os == 'macos-latest' && hashFiles('latest-macos.json') != '') || (matrix.os == 'windows-latest' && hashFiles('latest-windows.json') != '') }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            latest-macos.json
            latest-windows.json
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}