name: Tauri Release (macOS, Windows)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps (npm ci)
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: npm ci

      - name: Install deps (npm install)
        if: ${{ hashFiles('package-lock.json') == '' }}
        run: npm install

      - name: Build web app
        run: npm run build

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Tauri build and release
        uses: tauri-apps/tauri-action@v0
        with:
          tauriScript: npx tauri
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: "Automated Tauri release"
          includeDebug: false
          prerelease: false
          macOSUniversal: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          # Uncomment only if your private key is password-protected:
          # TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          # TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      # WINDOWS: download MSI/EXE from the just-created release, sign them, build latest-windows.json, upload
      - name: Prepare + upload latest-windows.json
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: |
          $tag = "${{ github.ref_name }}"
          $repo = "${{ github.repository }}"

          gh release download $tag -p "*.msi" -D .
          gh release download $tag -p "*-setup*.exe" -D . || true

          $msi = Get-ChildItem *.msi -ErrorAction SilentlyContinue | Select-Object -First 1
          $exe = Get-ChildItem *-setup*.exe -ErrorAction SilentlyContinue | Select-Object -First 1

          if (-not $msi -and -not $exe) { throw "No Windows installer assets found" }

          $version = $tag.TrimStart('v')
          $pubDate = (Get-Date).ToUniversalTime().ToString("s") + "Z"

          $platforms = @{}

          if ($msi) {
            $msiUrl = "https://github.com/$repo/releases/download/$tag/$($msi.Name)"
            $sigMsi = npx tauri signer sign "$($msi.Name)"
            $platforms["windows-x86_64"] = @{ signature = $sigMsi; url = $msiUrl }
            $platforms["windows-x86_64-msi"] = @{ signature = $sigMsi; url = $msiUrl }
          }

          if ($exe) {
            $exeUrl = "https://github.com/$repo/releases/download/$tag/$($exe.Name)"
            $sigExe = npx tauri signer sign "$($exe.Name)"
            $platforms["windows-x86_64-nsis"] = @{ signature = $sigExe; url = $exeUrl }
          }

          $json = @{
            version = $version
            notes = "Automated Tauri release"
            pub_date = $pubDate
            platforms = $platforms
          } | ConvertTo-Json -Depth 10

          $json | Out-File latest-windows.json -Encoding utf8
          gh release upload $tag latest-windows.json --clobber

      # macOS: download DMG from the release, sign it, build latest-macos.json, upload
      - name: Generate + upload latest-macos.json
        if: matrix.os == 'macos-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release download "${TAG}" -p "*.dmg" -D .
          DMG="$(ls *.dmg | head -n1 || true)"
          if [ -z "${DMG}" ]; then echo "No DMG asset on release"; exit 1; fi

          # Sign the DMG to get the updater signature
          SIG_CONTENT="$(npx tauri signer sign "${DMG}")"
          VERSION="${TAG#v}"
          PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          URL="https://github.com/${REPO}/releases/download/${TAG}/${DMG}"

          cat > latest-macos.json <<JSON
          {
            "version": "${VERSION}",
            "notes": "Automated Tauri release",
            "pub_date": "${PUB_DATE}",
            "platforms": {
              "darwin-x86_64": { "signature": ${SIG_CONTENT@Q}, "url": "${URL}" },
              "darwin-aarch64": { "signature": ${SIG_CONTENT@Q}, "url": "${URL}" }
            }
          }
          JSON

          gh release upload "${TAG}" latest-macos.json --clobber