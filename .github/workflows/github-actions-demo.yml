name: Tauri Release (macOS, Windows)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps (npm ci)
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: npm ci

      - name: Install deps (npm install)
        if: ${{ hashFiles('package-lock.json') == '' }}
        run: npm install

      - name: Build web app
        run: npm run build

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Tauri build and release
        uses: tauri-apps/tauri-action@v0
        with:
          tauriScript: npx tauri
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: "Automated Tauri release"
          includeDebug: false
          prerelease: false
          macOSUniversal: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          # No password envs (key is unencrypted)

      # Grab tauri's latest.json immediately and re-upload with OS-specific name
      - name: Prepare latest-macos.json
        if: matrix.os == 'macos-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # retry until the asset appears (eventual consistency)
          for i in {1..10}; do
            if gh release download "${{ github.ref_name }}" -p latest.json -D .; then
              mv latest.json latest-macos.json
              gh release upload "${{ github.ref_name }}" latest-macos.json --clobber
              exit 0
            fi
            echo "latest.json not up yet, retry $i"; sleep 5
          done
          echo "latest.json not found after retries"; exit 1

      - name: Prepare latest-windows.json
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for ($i=1; $i -le 10; $i++) {
            try {
              gh release download "${{ github.ref_name }}" -p latest.json -D .
              Rename-Item latest.json latest-windows.json -Force
              gh release upload "${{ github.ref_name }}" latest-windows.json --clobber
              exit 0
            } catch {
              Write-Host "latest.json not up yet, retry $i"; Start-Sleep -Seconds 5
            }
          }
          throw "latest.json not found after retries"

  merge-latest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Merge per-OS updater JSONs into one latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          gh release download "$TAG" -p latest-macos.json -D .
          gh release download "$TAG" -p latest-windows.json -D .
          sudo apt-get update && sudo apt-get install -y jq
          VERSION="${TAG#v}"
          PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq -s --arg v "$VERSION" --arg d "$PUB_DATE" \
            '{version:$v, notes:"Automated Tauri release", pub_date:$d, platforms:(.[0].platforms + .[1].platforms)}' \
            latest-macos.json latest-windows.json > latest.json
          gh release upload "$TAG" latest.json --clobber